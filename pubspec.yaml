name: my_app
description: A Flutter weather application with real-time updates, location-based weather, and a modern UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
